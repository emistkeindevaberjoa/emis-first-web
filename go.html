```html
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moment... 💗</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #ffd6e7, #ffeaf2);

            font-family: Arial, sans-serif;
            color: #5c3042;
        }

        .container {
            width: 90%;
            max-width: 420px;

            padding: 40px 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.85);

            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(92, 48, 66, 0.15);
        }

        .heart {
            font-size: 65px;
            animation: heartbeat 1.3s infinite;
        }

        h1 {
            margin-top: 15px;
            font-size: 28px;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
        }

        .button {
            display: inline-block;

            margin-top: 20px;
            padding: 14px 28px;

            background: #ff7fa8;
            color: white;

            text-decoration: none;

            border-radius: 999px;

            font-size: 17px;
            font-weight: bold;

            transition: 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
            background: #ff6d9c;
        }

        .small {
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.7;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">💗</div>

        <h1>Einen kleinen Moment...</h1>

        <p>
            Deine Überraschung wartet schon auf dich. 🥰
        </p>

        <p>
            Klicke einfach auf den Button, um sie zu öffnen.
        </p>

        <a
            class="button"
            href="https://emiistkeindevaberjoa.github.io/emis-first-web/"
        >
            💗 Öffnen
        </a>

        <p class="small">
            Falls du nicht weitergeleitet wirst, kannst du den Button benutzen.
        </p>

    </div>

    <script>
        setTimeout(function() {
            window.location.href =
                "https://emiistkeindevaberjoa.github.io/emis-first-web/";
        }, 2500);
    </script>

</body>
</html>
```
